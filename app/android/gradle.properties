# Reduced memory settings to prevent system freezing
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Limit parallel workers to reduce CPU load
org.gradle.parallel=false
org.gradle.workers.max=2
# Disable daemon to free resources after build
org.gradle.daemon=false
# Network timeout settings to handle slow/unstable connections
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000
android.useAndroidX=true
android.enableJetifier=true
